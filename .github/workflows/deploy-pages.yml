name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run backend tests
        run: ./mvnw --batch-mode test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure API endpoint and static assets
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          mkdir -p site/css
          cp src/main/resources/static/css/style.css site/css/style.css
          node -e 'const fs = require("node:fs"); const value = process.env.API_BASE_URL || ""; fs.writeFileSync("site/config.js", `window.APP_CONFIG = ${JSON.stringify({ apiBaseUrl: value })};\n`);'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
