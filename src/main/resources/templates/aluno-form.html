<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${edicao} ? 'Editar aluno | Sistema Acadêmico' : 'Novo aluno | Sistema Acadêmico'">
      Novo aluno | Sistema Acadêmico
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">SA</span>
          <span>Sistema Acadêmico</span>
        </a>
        <nav class="main-nav" aria-label="Navegação principal">
          <a href="/alunos">Alunos</a>
          <a href="/alunos/novo">Novo aluno</a>
        </nav>
      </header>

      <main>
        <section class="page-heading">
          <div class="page-heading-copy">
            <p class="eyebrow" th:text="${edicao} ? 'Edição' : 'Cadastro'">Cadastro</p>
            <h1 th:text="${edicao} ? 'Editar aluno' : 'Novo aluno'">Novo aluno</h1>
            <p class="page-description"
              th:text="${edicao} ? 'Atualize os dados do aluno.' : 'Preencha os dados para adicionar um aluno ao sistema.'">
              Preencha os dados para adicionar um aluno ao sistema.
            </p>
          </div>
        </section>

        <form class="surface form-card"
          th:action="${edicao} ? @{/alunos/{id}(id=${aluno.id})} : @{/alunos}"
          action="/alunos" method="post">
          <div class="form-grid">
            <div class="form-field form-field-full">
              <label for="nome">Nome completo</label>
              <input id="nome" type="text" name="nome" autocomplete="name"
                th:value="${aluno.nome}" required
                th:attr="aria-invalid=${erros != null and erros.containsKey('nome')},
                  aria-describedby=${erros != null and erros.containsKey('nome') ? 'nome-error' : null}" />
              <p class="field-error" id="nome-error" role="alert"
                th:if="${erros != null and erros.containsKey('nome')}"
                th:text="${erros['nome']}"></p>
            </div>

            <div class="form-field form-field-full">
              <label for="email">E-mail</label>
              <input id="email" type="email" name="email" autocomplete="email"
                th:value="${aluno.email}" required
                th:attr="aria-invalid=${erros != null and erros.containsKey('email')},
                  aria-describedby=${erros != null and erros.containsKey('email') ? 'email-error' : null}" />
              <p class="field-error" id="email-error" role="alert"
                th:if="${erros != null and erros.containsKey('email')}"
                th:text="${erros['email']}"></p>
            </div>

            <div class="form-field">
              <label for="matricula">Matrícula</label>
              <input id="matricula" type="text" name="matricula"
                th:value="${aluno.matricula}" required
                th:attr="aria-invalid=${erros != null and erros.containsKey('matricula')},
                  aria-describedby=${erros != null and erros.containsKey('matricula') ? 'matricula-error' : null}" />
              <p class="field-error" id="matricula-error" role="alert"
                th:if="${erros != null and erros.containsKey('matricula')}"
                th:text="${erros['matricula']}"></p>
            </div>

            <div class="form-field">
              <label for="idade">Idade</label>
              <input id="idade" type="number" name="idade" min="1"
                th:value="${idadeCampo}" required
                th:attr="aria-invalid=${erros != null and erros.containsKey('idade')},
                  aria-describedby=${erros != null and erros.containsKey('idade') ? 'idade-error' : null}" />
              <p class="field-error" id="idade-error" role="alert"
                th:if="${erros != null and erros.containsKey('idade')}"
                th:text="${erros['idade']}"></p>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" th:text="${edicao} ? 'Salvar alterações' : 'Cadastrar aluno'">
              Cadastrar aluno
            </button>
            <a class="button button-secondary" href="/alunos">Cancelar</a>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
