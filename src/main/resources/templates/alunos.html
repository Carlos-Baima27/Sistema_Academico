<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>Alunos cadastrados</h1>

    <a href="/alunos/novo">Cadastrar novo aluno</a>
    <br><br>

    <p th:if="${#lists.isEmpty(alunos)}">Nenhum aluno cadastrado ainda.</p>

    <div class="table-wrapper" th:unless="${#lists.isEmpty(alunos)}">
        <table>
            <caption>Alunos cadastrados</caption>
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">E-mail</th>
                    <th scope="col">Matrícula</th>
                    <th scope="col">Idade</th>
                    <th scope="col">Média</th>
                    <th scope="col">Situação</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="aluno: ${alunos}">
                    <td th:text="${aluno.id}"></td>
                    <td th:text="${aluno.nome}"></td>
                    <td th:text="${aluno.email}"></td>
                    <td th:text="${aluno.matricula}"></td>
                    <td th:text="${aluno.idade}"></td>
                    <td th:text="${aluno.media}"></td>
                    <td th:text="${aluno.situacao}"></td>
                    <td>
                        <a th:href="@{/alunos/{id}(id=${aluno.id})}">Detalhes</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <a href="/">Voltar</a>
</body>
</html>
