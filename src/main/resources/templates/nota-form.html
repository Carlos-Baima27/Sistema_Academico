<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Nota</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <h1>Cadastrar nota</h1>

    <p>Aluno: <span th:text="${aluno.nome}"></span></p>

    <form th:action="@{/alunos/{id}/notas(id=${aluno.id})}" method="post">
      <label for="descricao">Descrição:</label>
      <input id="descricao" type="text" name="descricao" required />
      <br /><br />

      <label for="valor">Valor (0 a 10):</label>
      <input id="valor" type="number" step="0.1" min="0" max="10" name="valor" required />
      <br /><br />

      <button type="submit">Cadastrar</button>
    </form>

    <br />
    <a th:href="@{/alunos/{id}(id=${aluno.id})}">Voltar</a>
  </body>
</html>
